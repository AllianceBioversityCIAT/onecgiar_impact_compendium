# Pre-commit hooks — https://pre-commit.com
# One-time setup per clone:  brew install gitleaks pre-commit && pre-commit install
# Secrets are then blocked at commit time, before they ever reach GitHub/GitGuardian.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
