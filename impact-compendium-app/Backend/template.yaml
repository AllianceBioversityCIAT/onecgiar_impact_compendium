AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Impact Compendium Backend API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.9
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: production

Parameters:
  Stage:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  ImpactCompendiumApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  ImpactCompendiumFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: main.handler
      Description: Impact Compendium FastAPI Backend
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /{proxy+}
            Method: ANY
        RootApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /
            Method: ANY

Outputs:
  ImpactCompendiumApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ImpactCompendiumApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"
  
  ImpactCompendiumFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ImpactCompendiumFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"
