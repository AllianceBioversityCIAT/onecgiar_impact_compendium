# SAM Configuration for Impact Compendium Backend

version = 0.1

[default]
[default.global.parameters]
stack_name = "impact-compendium-backend"
profile = "IBD-DEV"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
profile = "IBD-DEV"
parameter_overrides = [
    "Environment=testing",
    "ProjectName=impact-compendium"
]

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Testing Environment Configuration
[testing]
[testing.deploy.parameters]
stack_name = "impact-compendium-backend-testing"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
profile = "IBD-DEV"
parameter_overrides = [
    "Environment=testing",
    "ProjectName=impact-compendium"
]

# Production Environment Configuration  
[production]
[production.deploy.parameters]
stack_name = "impact-compendium-backend-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
profile = "IBD-DEV"
parameter_overrides = [
    "Environment=prod",
    "ProjectName=impact-compendium"
]
