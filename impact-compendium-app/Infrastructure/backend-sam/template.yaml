AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Impact Compendium Backend API - Update Existing Infrastructure

Parameters:
  Environment:
    Type: String
    Default: testing
    AllowedValues: [testing, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: impact-compendium
    Description: Project name for resource naming

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.9
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

Resources:
  ImpactCompendiumApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Name: !Sub "${ProjectName}-backend-api-${Environment}"
      Description: Impact Compendium FastAPI Backend
      BinaryMediaTypes:
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/octet-stream"
        - "*/*"

  ImpactCompendiumFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend-api-${Environment}"
      CodeUri: ../../Backend/
      Handler: main.handler
      Description: Impact Compendium FastAPI Backend
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-lambda-sg-id"
        SubnetIds:
          - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1"
          - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2"
      Environment:
        Variables:
          STAGE: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
          DB_NAME: impact_compendium
          DB_USER: admin
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${ProjectName}/${Environment}/db-password:SecretString:password}}"
          DB_PORT: "3306"
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-cognito-pool-id"
          COGNITO_CLIENT_ID:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-cognito-client-id"
          COGNITO_REGION: !Ref AWS::Region
      Policies:
        - VPCAccessPolicy: {}  # Required for VPC Lambda functions
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:*
              Resource: 
                - !Sub 
                  - "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
                  - UserPoolId:
                      Fn::ImportValue: !Sub "${ProjectName}-${Environment}-cognito-pool-id"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/db-password*"
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /{proxy+}
            Method: ANY
        RootApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /
            Method: ANY

Outputs:
  ImpactCompendiumApiUrl:
    Description: API Gateway endpoint URL for Impact Compendium Backend
    Value: !Sub "https://${ImpactCompendiumApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "${ProjectName}-backend-${Environment}-api-url"
  
  ImpactCompendiumFunctionArn:
    Description: Impact Compendium Lambda Function ARN
    Value: !GetAtt ImpactCompendiumFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-backend-${Environment}-function-arn"

  ImpactCompendiumFunctionName:
    Description: Impact Compendium Lambda Function Name
    Value: !Ref ImpactCompendiumFunction
    Export:
      Name: !Sub "${ProjectName}-backend-${Environment}-function-name"

  SwaggerUIUrl:
    Description: Swagger UI Documentation URL
    Value: !Sub "https://${ImpactCompendiumApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/docs"
    Export:
      Name: !Sub "${ProjectName}-backend-${Environment}-docs-url"
