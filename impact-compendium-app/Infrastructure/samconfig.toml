# SAM Configuration for IGAD Impact Compendium
version = 0.1

[default]
[default.global.parameters]
stack_name = "impact-compendium"
profile = "IBD-DEV"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "impact-compendium"
parameter_overrides = "ProjectName=impact-compendium"
image_repositories = []

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Testing Environment Configuration
[testing]
[testing.global.parameters]
stack_name = "impact-compendium-testing"
profile = "IBD-DEV"
region = "us-east-1"

[testing.deploy.parameters]
template_file = "template-testing.yaml"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = false
disable_rollback = false
parameter_overrides = [
    "Environment=testing",
    "ProjectName=impact-compendium"
]
tags = [
    "Project=impact-compendium",
    "Environment=testing",
    "CostCenter=research-platform",
    "Owner=cgiar-alliance",
    "CreatedBy=sam-deployment"
]

# Production Environment Configuration
[production]
[production.global.parameters]
stack_name = "impact-compendium-production"
profile = "IBD-DEV"
region = "us-east-1"

[production.deploy.parameters]
template_file = "template-production.yaml"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "impact-compendium-production"
parameter_overrides = [
    "Environment=production",
    "ProjectName=impact-compendium",
    "ExistingRDSEndpoint=your-existing-rds-endpoint.amazonaws.com",
    "CustomDomainName=",
    "ACMCertificateArn="
]
tags = [
    "Project=impact-compendium",
    "Environment=production",
    "CostCenter=research-platform",
    "Owner=cgiar-alliance",
    "CreatedBy=sam-deployment"
]
