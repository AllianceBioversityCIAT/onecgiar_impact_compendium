# SAM Configuration for Impact Compendium Application
# This file contains environment-specific deployment parameters

version = 0.1

[default]
[default.global]
[default.global.parameters]
stack_name = "impact-compendium-dev"
resolve_s3 = true
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "ProjectName=impact-compendium",
    "DBInstanceClass=db.t3.micro",
    "DBAllocatedStorage=20",
    "EnableMultiAZ=false"
]
image_repositories = []

[default.build]
[default.build.parameters]
cached = true
parallel = true

[default.validate]
[default.validate.parameters]
lint = true

[default.deploy]
[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
stack_name = "impact-compendium-dev"
resolve_s3 = true
region = "us-east-1"
image_repositories = []
parameter_overrides = [
    "Environment=dev",
    "ProjectName=impact-compendium",
    "DBInstanceClass=db.t3.micro",
    "DBAllocatedStorage=20",
    "EnableMultiAZ=false"
]

[default.package]
[default.package.parameters]
resolve_s3 = true

[default.sync]
[default.sync.parameters]
watch = true

[default.local_start_api]
[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda]
[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# ============================================================================
# DEVELOPMENT ENVIRONMENT
# ============================================================================

[dev]
[dev.global]
[dev.global.parameters]
stack_name = "impact-compendium-dev"
s3_bucket = "impact-compendium-sam-artifacts-dev"
s3_prefix = "dev"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "ProjectName=impact-compendium",
    "DBInstanceClass=db.t3.micro",
    "DBAllocatedStorage=20",
    "EnableMultiAZ=false"
]

[dev.build]
[dev.build.parameters]
cached = true
parallel = true

[dev.deploy]
[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
stack_name = "impact-compendium-dev"
s3_bucket = "impact-compendium-sam-artifacts-dev"
s3_prefix = "dev"
region = "us-east-1"
parameter_overrides = [
    "Environment=dev",
    "ProjectName=impact-compendium",
    "DBInstanceClass=db.t3.micro",
    "DBAllocatedStorage=20",
    "EnableMultiAZ=false"
]
tags = [
    "Environment=dev",
    "Project=impact-compendium",
    "Owner=cgiar-alliance",
    "CostCenter=research-platform",
    "BudgetCategory=infrastructure",
    "CreatedBy=sam-deployment"
]

