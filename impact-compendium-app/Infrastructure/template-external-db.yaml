AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Impact Compendium Database - Serverless Research Platform (External DB)
  
  SAM Template for CGIAR/Alliance Impact Compendium application with
  FastAPI backend, external MySQL RDS, and simplified architecture.

# Global configuration
Globals:
  Function:
    Runtime: python3.11
    Architecture: arm64
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: INFO
        DB_HOST: !Ref DatabaseHost
        DB_PORT: !Ref DatabasePort
        DB_NAME: !Ref DatabaseName
        DB_USER: !Ref DatabaseUser
        DB_PASSWORD: !Ref DatabasePassword
    Tracing: Active
  Api:
    TracingConfig:
      PassthroughBehavior: Active
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
      MaxAge: "'600'"

# Parameters
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name for resource naming and configuration
  
  ProjectName:
    Type: String
    Default: impact-compendium
    Description: Project name for resource naming
  
  DatabaseHost:
    Type: String
    NoEcho: true
    Description: Database host endpoint
  
  DatabasePort:
    Type: Number
    Default: 3306
    Description: Database port
  
  DatabaseName:
    Type: String
    NoEcho: true
    Description: Database name
  
  DatabaseUser:
    Type: String
    NoEcho: true
    Description: Database username
  
  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Database password

Resources:
  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  StudiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-studies"
      CodeUri: ../Backend/
      Handler: app.main.handler
      Description: Studies management API endpoints
      Events:
        StudiesApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /studies
            Method: ANY
        StudiesProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /studies/{proxy+}
            Method: ANY

  IndicatorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-indicators"
      CodeUri: ../Backend/
      Handler: app.main.handler
      Description: Indicators management API endpoints
      Events:
        IndicatorsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /indicators
            Method: ANY
        IndicatorsProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /indicators/{proxy+}
            Method: ANY

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-auth"
      CodeUri: ../Backend/
      Handler: app.main.handler
      Description: Authentication and user management endpoints
      Events:
        AuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /auth
            Method: ANY
        AuthProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImpactCompendiumApi
            Path: /auth/{proxy+}
            Method: ANY

  # ============================================================================
  # API GATEWAY
  # ============================================================================

  ImpactCompendiumApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      StageName: !Ref Environment
      Description: Impact Compendium REST API
      EndpointConfiguration:
        Type: REGIONAL

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ImpactCompendiumApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-api-url"

  StudiesFunctionName:
    Description: Studies Lambda function name
    Value: !Ref StudiesFunction
    Export:
      Name: !Sub "${ProjectName}-${Environment}-studies-function"
