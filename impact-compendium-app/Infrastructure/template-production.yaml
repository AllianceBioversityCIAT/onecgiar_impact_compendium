AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IGAD Impact Compendium - Production Environment

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name
  ProjectName:
    Type: String
    Default: igad
    Description: Project name
  ExistingRDSEndpoint:
    Type: String
    Description: Existing RDS endpoint for production
    Default: ""
  CustomDomainName:
    Type: String
    Description: Custom domain name for CloudFront
    Default: ""
  ACMCertificateArn:
    Type: String
    Description: ACM certificate ARN for custom domain
    Default: ""

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 60
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      CreatedBy: sam-deployment

Resources:
  # HTTP API Gateway
  IgadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: backend

  # Lambda Function
  IgadBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend-${Environment}"
      CodeUri: ../Backend/
      Handler: main.handler
      Environment:
        Variables:
          DATABASE_URL: !Sub "{{resolve:ssm:/${ProjectName}/${Environment}/database-url}}"
          COGNITO_USER_POOL_ID: !Ref IgadUserPool
          COGNITO_CLIENT_ID: !Ref IgadUserPoolClient
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref IgadApi
            Path: /{proxy+}
            Method: ANY
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: backend

  # S3 Bucket for Frontend
  IgadFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${Environment}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: frontend

  # S3 Bucket Policy
  IgadFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IgadFrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${IgadFrontendBucket}/*"

  # CloudFront Distribution
  IgadCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt IgadFrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref ACMCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !GetAtt IgadWAF.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: frontend

  # WAF for CloudFront
  IgadWAF:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-waf-${Environment}"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}WAF${Environment}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: security

  # Cognito User Pool
  IgadUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users-${Environment}"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: auth

  # Cognito User Pool Client
  IgadUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-client-${Environment}"
      UserPoolId: !Ref IgadUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH

  # SSM Parameter for External Database URL
  DatabaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/database-url"
      Type: String
      Value: !Sub "mysql://username:password@${ExistingRDSEndpoint}:3306/igad_compendium"
      Description: "Update this parameter with actual database credentials"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  # CloudWatch Log Groups
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${ProjectName}-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub "https://${IgadApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-api-endpoint"

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}"
      - !Sub "https://${IgadCloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cloudfront-url"

  S3BucketName:
    Description: S3 bucket name for frontend
    Value: !Ref IgadFrontendBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-s3-bucket"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref IgadUserPool
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cognito-pool-id"

  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref IgadUserPoolClient
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cognito-client-id"

  WAFArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt IgadWAF.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-waf-arn"
