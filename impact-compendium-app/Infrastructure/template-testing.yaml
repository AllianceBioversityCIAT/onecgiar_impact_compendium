AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IGAD Impact Compendium - Testing Environment

Parameters:
  Environment:
    Type: String
    Default: testing
    Description: Environment name
  ProjectName:
    Type: String
    Default: igad
    Description: Project name

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      CreatedBy: sam-deployment

Resources:
  # HTTP API Gateway
  IgadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: backend

  # Lambda Function
  IgadBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend-${Environment}"
      CodeUri: ../Backend/
      Handler: main.handler
      Environment:
        Variables:
          DATABASE_URL: !Sub "{{resolve:ssm:/${ProjectName}/${Environment}/database-url}}"
          COGNITO_USER_POOL_ID: !Ref IgadUserPool
          COGNITO_CLIENT_ID: !Ref IgadUserPoolClient
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref IgadApi
            Path: /{proxy+}
            Method: ANY
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: backend

  # S3 Bucket for Frontend
  IgadFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${Environment}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: frontend

  # S3 Bucket Policy
  IgadFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IgadFrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${IgadFrontendBucket}/*"

  # CloudFront Distribution
  IgadCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt IgadFrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Enabled: true
        PriceClass: PriceClass_100
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: frontend

  # Cognito User Pool
  IgadUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users-${Environment}"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Component: auth

  # Cognito User Pool Client
  IgadUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-client-${Environment}"
      UserPoolId: !Ref IgadUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH

  # VPC for RDS
  IgadVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc-${Environment}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IgadVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-1-${Environment}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IgadVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-2-${Environment}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # DB Subnet Group
  IgadDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${ProjectName}-db-subnet-${Environment}"
      DBSubnetGroupDescription: Subnet group for IGAD RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Security Groups
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-db-sg-${Environment}"
      GroupDescription: Security group for RDS database
      VpcId: !Ref IgadVPC
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-lambda-sg-${Environment}"
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref IgadVPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Security Group Rules (separate to avoid circular dependency)
  DatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  LambdaSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup

  # RDS MySQL Instance
  IgadDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db-${Environment}"
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0.43"
      AllocatedStorage: 20
      StorageType: gp2
      DBName: igad_compendium
      MasterUsername: admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${ProjectName}/${Environment}/db-password:SecretString:password}}"
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref IgadDBSubnetGroup
      BackupRetentionPeriod: 1
      MultiAZ: false
      StorageEncrypted: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: database

  # Database Password Secret
  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${Environment}/db-password"
      Description: Database password for IGAD
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # SSM Parameter for Database URL
  DatabaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/database-url"
      Type: String
      Value: !Sub "mysql://admin:{{resolve:secretsmanager:${ProjectName}/${Environment}/db-password:SecretString:password}}@${IgadDatabase.Endpoint.Address}:3306/igad_compendium"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub "https://${IgadApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-api-endpoint"

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub "https://${IgadCloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cloudfront-url"

  S3BucketName:
    Description: S3 bucket name for frontend
    Value: !Ref IgadFrontendBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-s3-bucket"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref IgadUserPool
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cognito-pool-id"

  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref IgadUserPoolClient
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cognito-client-id"

  DatabaseEndpoint:
    Description: RDS database endpoint
    Value: !GetAtt IgadDatabase.Endpoint.Address
    Export:
      Name: !Sub "${ProjectName}-${Environment}-db-endpoint"
